      note: No first-party REST API is documented.
sources:
  - url: https://valley.com
    type: Website
    note: Corporate marketing site (HTTP 200); no developer/API surface.
  - url: https://www.openbankingtracker.com/provider/valley-national-bank/apis
    type: Reference
    note: States no developer resources, no API products, no SDKs, no Postman collections for Valley National Bank; access via aggregators.
  - url: https://fintable.io/coverage/banks/United%20States/2185_valley-national-bank
    type: Reference
    note: Documents Valley National Bank data availability via Finicity aggregation.
actions:
  reason: |
    No first-party public API exists to model. Recorded an honest
    identity-only (aggregator-only) profile with verified corporate links.
    No OpenAPI/AsyncAPI artifacts were authored because none are documented.
