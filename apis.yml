name: Valley National Bank
kind: company
description: >-
  Valley National Bank is a nationally chartered commercial bank (OCC-regulated)
  and the principal banking subsidiary of Valley National Bancorp (NASDAQ: VLY),
  a regional financial holding company founded in 1927 with roughly $64 billion
  in assets and more than 200 offices serving consumers, families, and businesses
  across New Jersey, New York, Florida, Alabama, California, and Illinois. Its
  business spans consumer banking, commercial banking, and treasury services. As
  of this profile Valley National Bank operates no first-party public developer
  portal and publishes no downloadable API specifications; consumer-permissioned
  account and transaction data is reached only through third-party open-finance
  aggregators (Finicity by Mastercard is documented, alongside general Plaid/Tink
  connectivity) rather than a directly exposed FDX-conformant or first-party API.
